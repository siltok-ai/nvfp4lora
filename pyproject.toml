[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvfp4lora"
version = "0.0.1"
description = "Streaming NVFP4 LoRA training on native Windows"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.11.0+cu130", "transformers==5.16.1", "peft==0.18.1", "safetensors==0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
